# Pytest config lives HERE, not in pyproject.toml, and that is deliberate.
#
# Vercel's Python builder treats the presence of pyproject.toml as "this is a uv/PEP-621
# project" and runs `uv lock`, which fails with
#     error: No `project` table found in: /vercel/path0/pyproject.toml
# because our config was pytest settings only. This repo isn't an installable package —
# api/index.py reaches src/ via sys.path and there is no build backend — so the fix is to
# have no pyproject.toml at all. Vercel then installs requirements.txt with pip.
#
# If you move these settings back into pyproject.toml, deploys will break again.

[pytest]
pythonpath = src .
testpaths = tests

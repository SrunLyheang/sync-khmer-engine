<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A monochrome favicon showing three lotus-bud shaped Angkor Wat-style temple towers on a terrace, with a naga serpent line undulating beneath and small kbach vine curls at the corners, on a rounded square keycap background.</desc>
